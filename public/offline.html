<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#081229" />
    <title>Cosmo Quest — オフライン</title>
    <style>
      *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 25%,#17356a,#081229 48%,#050b1c);color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;text-align:center}.card{max-width:420px;padding:36px 28px;border:1px solid #65d6ff55;border-radius:28px;background:#081229cc;box-shadow:0 24px 80px #0008}.icon{width:112px;height:112px;margin:auto;border-radius:28px}h1{margin:22px 0 10px;font-size:28px}p{margin:0 0 24px;color:#cbd9f5;line-height:1.8}button{border:0;border-radius:999px;padding:14px 24px;background:#65d6ff;color:#061127;font:inherit;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.png" alt="Cosmo Quest" />
      <h1>宇宙との通信がオフラインです</h1>
      <p>一度開いた学習画面はオフラインでも利用できます。通信が戻ったら、もう一度お試しください。</p>
      <button type="button" onclick="location.reload()">再接続する</button>
    </main>
  </body>
</html>
